services:
  jenkins:
    image: jenkins/jenkins:jdk21
    container_name: jenkins
    ports:
      - "8080:8080"
    volumes:
      - ./jenkins_home:/var/jenkins_home
    networks:
      - jenkins_network

  remote-host:
    container_name: remote-host
    image: remote-host
    build:
      context: remote_host
      dockerfile: Dockerfile
    networks:
      - jenkins_network

networks:
  jenkins_network: